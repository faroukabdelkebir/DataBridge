spring.application.name=AuthMS
spring.config.import=optional:file:.env[.properties]
server.port=8090



spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=AuthPool


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/oauth2-schema.sql


# Override in production with a 256-bit Base64-encoded secret
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXP_MS}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXP_MS}

app.bff.targets.userms=http://localhost:8085
app.bff.targets.aiagents=http://localhost:65015
app.bff.targets.extractor=http://localhost:65005

spring.security.oauth2.client.registration.frontend-bff.client-id=frontend-bff
spring.security.oauth2.client.registration.frontend-bff.client-secret=${BFF_CLIENT_SECRET}
spring.security.oauth2.client.registration.frontend-bff.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.frontend-bff.scope=user:read,user:write,monitoring:read,batch:execute,ai:read,ai:execute
spring.security.oauth2.client.provider.frontend-bff.token-uri=http://localhost:8090/oauth2/token

app.oauth2.issuer=http://localhost:8090


app.reset-password.token-expiration-minutes=${RESET_TOKEN_EXP_MIN}
app.reset-password.base-url=${FRONTEND_URL:http://localhost:4200}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# OAuth2 client secrets — injected from env, never committed.
app.oauth2.clients.etl.secret=${ETL_CLIENT_SECRET}
app.oauth2.clients.bff.secret=${BFF_CLIENT_SECRET}
app.oauth2.clients.auth.secret=${AUTH_SERVICE_CLIENT_SECRET}

# AuthMS agit aussi comme CLIENT OAuth2 (client_credentials) pour appeler UserMS.
# La registration "userms" est utilisee par OAuth2ClientHttpRequestInterceptor.
# token-uri pointe vers le propre endpoint /oauth2/token de ce service.
spring.security.oauth2.client.registration.userms.client-id=auth-service
spring.security.oauth2.client.registration.userms.client-secret=${AUTH_SERVICE_CLIENT_SECRET}
spring.security.oauth2.client.registration.userms.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.userms.scope=user:credentials:read,user:credentials:write
spring.security.oauth2.client.registration.userms.provider=self
spring.security.oauth2.client.provider.self.token-uri=http://localhost:8090/oauth2/token

# optional persistent RSA signing key (PKCS12). Leave empty for an
# ephemeral dev key. Generate one, e.g.:
#   keytool -genkeypair -alias auth-jwt -keyalg RSA -keysize 2048 \
#           -keystore auth-jwt.p12 -storetype PKCS12 -validity 3650
app.oauth2.jwk.keystore-path=${JWK_KEYSTORE_PATH:}
app.oauth2.jwk.keystore-password=${JWK_KEYSTORE_PASSWORD:}
app.oauth2.jwk.key-alias=${JWK_KEY_ALIAS:}

# shared secret for internal service-to-service calls to UserMS.
# Must match UserMS app.internal.api-key.
app.internal.api-key=${INTERNAL_API_KEY}

eureka.client.service-url.defaultZone=${EUREKA_URL}
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}


management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized


logging.level.org.springframework.security=INFO
logging.level.wevioo.se.authms=DEBUG
#logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{40} - %msg%n
