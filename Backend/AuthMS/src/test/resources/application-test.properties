spring.cloud.discovery.enabled=false
eureka.client.enabled=false

app.jwt.secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
app.jwt.access-token-expiration-ms=3600000
app.jwt.refresh-token-expiration-ms=604800000
app.oauth2.issuer=http://localhost:8090
app.reset-password.token-expiration-minutes=15
app.reset-password.base-url=http://localhost:4200
app.oauth2.clients.etl.secret=test-etl-secret
app.oauth2.clients.bff.secret=test-bff-secret
app.oauth2.clients.auth.secret=test-auth-secret
app.internal.api-key=test-api-key

spring.datasource.url=jdbc:h2:mem:authms-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never
