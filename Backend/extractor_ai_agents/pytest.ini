[pytest]
DJANGO_SETTINGS_MODULE = tests.settings_test
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --import-mode=importlib
    -p tests_bootstrap

markers =
    unit: test unitaire — une fonction/classe isolee, toutes les I/O sont doublees
    regression: test de non-regression — verrouille un contrat ou un bug deja corrige

filterwarnings =
    ignore::DeprecationWarning:django.*
