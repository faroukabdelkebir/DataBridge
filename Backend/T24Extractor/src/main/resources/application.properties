#----------------------------------------------------
#	Traces level settings
#----------------------------------------------------
logging.level.root=info

#----------------------------------------------------
#	Global settings
#----------------------------------------------------

spring.threads.virtual.enabled=true
spring.main.allow-bean-definition-overriding=true
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false
spring.main.banner-mode=off
workers.number=4
server.port=65005
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schemas/mssql-schema.sql
spring.sql.init.separator=GO
extractor.scheduler.poll-ms=60000

spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.data.jdbc.autoconfigure.DataJdbcRepositoriesAutoConfiguration

#----------------------------------------------------
#	Eureka client settings
#----------------------------------------------------
MONITOR_URL=http://localhost:8761/eureka

eureka.client.serviceUrl.defaultZone=${MONITOR_URL}
eureka.instance.preferIpAddress=true
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


#----------------------------------------------------
#	Oracle settings
#----------------------------------------------------

ORACLE_URL=127.0.0.1:1521
ORACLE_SID=XE
ORACLE_USERNAME=T24_USER
ORACLE_PASSWORD=20011920
ORACLE_SERVICE=FREEPDB1

spring.datasource.t24.url=jdbc:oracle:thin:@//${ORACLE_URL}/${ORACLE_SERVICE}
spring.datasource.t24.username=${ORACLE_USERNAME}
spring.datasource.t24.password=${ORACLE_PASSWORD}
spring.datasource.t24.driver-class-name=oracle.jdbc.OracleDriver




#----------------------------------------------------
#	BI settings (SQL Server)
#----------------------------------------------------

spring.datasource.bi.url=jdbc:sqlserver://${BI_URL};databaseName=${BI_DB};encrypt=false;useBulkCopyForBatchInsert=true
spring.datasource.bi.username=${BI_USER}
spring.datasource.bi.password=${BI_PASS}
spring.datasource.bi.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

BI_URL=127.0.0.1:1433
BI_DB=T24_TEST
BI_USER=T24
BI_PASS=wevioo2026


#----------------------------------------------------
#	OAuth2 Resource Server (validation des JWT AuthMS)
#----------------------------------------------------
AUTHMS_URL=http://localhost:8090

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTHMS_URL}/oauth2/jwks
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTHMS_URL}

# --- Monitoring Prometheus ---
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.access=read-only
management.metrics.tags.application=${spring.application.name}