spring.application.name=MonitoringMS
server.port=65010
spring.main.banner-mode=off
spring.threads.virtual.enabled=true

spring.sql.init.mode=never
spring.batch.jdbc.initialize-schema=never

BI_URL=127.0.0.1:1433
BI_DB=T24_TEST
BI_USER=T24
BI_PASS=wevioo2026

spring.datasource.url=jdbc:sqlserver://${BI_URL};databaseName=${BI_DB};encrypt=false
spring.datasource.username=${BI_USER}
spring.datasource.password=${BI_PASS}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.pool-name=MonitorPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000


MONITOR_URL=http://localhost:8761/eureka
eureka.client.serviceUrl.defaultZone=${MONITOR_URL}
eureka.instance.preferIpAddress=true
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always


logging.level.root=info
logging.level.com=debug


monitor.sla.customer=07:00
monitor.sla.ft-his=07:30
monitor.sla.aa-bill=07:30
monitor.sla.main=08:00


monitor.alert.consecutive-failure-threshold=3
monitor.alert.reconciliation-tolerance-pct=5