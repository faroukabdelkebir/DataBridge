server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    client_max_body_size 50M;

    # Resolver Docker : permet a nginx de demarrer meme si Kong
    # n'est pas encore pret (resolution DNS a la demande).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $kong http://kong:8000;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/font-woff font/woff2 image/svg+xml;
    gzip_min_length 1024;

    # -----------------------------------------------------------------
    #  Proxy vers Kong
    #  environment.prod.ts utilise gatewayUrl:'' donc l'application
    #  appelle des chemins relatifs. Ces blocs doivent correspondre
    #  exactement aux "paths" declares dans kong.yml.
    # -----------------------------------------------------------------
    location ~ ^/(authms|userms|extractor|monitoring|aiagents)/ {
        proxy_pass $kong$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Les agents IA peuvent etre lents
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        proxy_buffering       off;
    }

    # Endpoints OAuth2 exposes directement par AuthMS
    location ~ ^/(oauth2|\.well-known)/ {
        proxy_pass $kong$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Routage SPA : renvoyer index.html pour toute route inconnue
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets avec hash
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Ne pas mettre en cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}