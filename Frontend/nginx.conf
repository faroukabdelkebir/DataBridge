server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/font-woff font/woff2 image/svg+xml;
    gzip_min_length 1024;

    # Routage SPA : renvoyer index.html pour toute route inconnue
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets avec hash
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Ne pas mettre en cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
