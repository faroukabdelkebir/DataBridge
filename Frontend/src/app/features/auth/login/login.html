<div class="auth-wrapper">
  <div class="auth-card surface-card">
    <div class="auth-brand">
      <img src="DataBridge%202.png" alt="DataBridge" class="auth-logo" />
      <span>{{ 'brand' | translate }}</span>
    </div>
    <h1>{{ 'auth.login.title' | translate }}</h1>
    <p class="auth-sub">{{ 'auth.login.subtitle' | translate }}</p>

    @if (error()) {
      <p-message severity="error" [text]="error()! | translate" styleClass="auth-msg" />
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <label class="field">
        <span>{{ 'common.username' | translate }}</span>
        <input pInputText type="text" formControlName="username"
               autocomplete="username" placeholder="john.doe" fluid />
        @if (form.controls.username.touched && form.controls.username.invalid) {
          <small class="field-error">{{ 'auth.validation.usernameRequired' | translate }}</small>
        }
      </label>

      <label class="field">
        <span>{{ 'common.password' | translate }}</span>
        <p-password formControlName="password" [feedback]="false"
                    [toggleMask]="true" autocomplete="current-password"
                    placeholder="••••••••" fluid />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <small class="field-error">{{ 'auth.validation.passwordMin8' | translate }}</small>
        }
      </label>

      <p-button type="submit" [label]="'auth.login.submit' | translate"
                icon="pi pi-sign-in" [loading]="loading()" fluid />
    </form>

    <p class="auth-foot">
      <a routerLink="/forgot-password">{{ 'auth.login.forgotPassword' | translate }}</a>
    </p>
  </div>
</div>
