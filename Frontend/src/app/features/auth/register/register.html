<div class="auth-wrapper">
  <div class="auth-card surface-card">
    <div class="auth-brand">
      <img src="DataBridge%202.png" alt="DataBridge" class="auth-logo" />
      <span>{{ 'brand' | translate }}</span>
    </div>
    <h1>{{ 'auth.register.title' | translate }}</h1>
    <p class="auth-sub">{{ 'auth.register.subtitle' | translate }}</p>

    @if (error()) {
      <p-message severity="error" [text]="error()! | translate" styleClass="auth-msg" />
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <label class="field">
        <span>{{ 'common.fullName' | translate }}</span>
        <input pInputText type="text" formControlName="fullName" fluid />
        @if (form.controls.fullName.touched && form.controls.fullName.invalid) {
          <small class="field-error">{{ 'auth.validation.fullNameMin3' | translate }}</small>
        }
      </label>

      <label class="field">
        <span>{{ 'common.email' | translate }}</span>
        <input pInputText type="email" formControlName="email" placeholder="you@example.com" fluid />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <small class="field-error">{{ 'auth.validation.emailRequired' | translate }}</small>
        }
      </label>

      <label class="field">
        <span>{{ 'common.password' | translate }}</span>
        <p-password formControlName="password" [toggleMask]="true" placeholder="••••••••" fluid />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <small class="field-error">{{ 'auth.validation.passwordMin6' | translate }}</small>
        }
      </label>

      <label class="field">
        <span>{{ 'common.confirmPassword' | translate }}</span>
        <p-password formControlName="confirm" [feedback]="false" [toggleMask]="true" placeholder="••••••••" fluid />
        @if (form.touched && form.hasError('mismatch')) {
          <small class="field-error">{{ 'auth.validation.mismatch' | translate }}</small>
        }
      </label>

      <p-button type="submit" [label]="'auth.register.submit' | translate" icon="pi pi-user-plus" [loading]="loading()" fluid />
    </form>

    <p class="auth-foot">
      {{ 'auth.register.haveAccount' | translate }}
      <a routerLink="/login">{{ 'auth.register.signin' | translate }}</a>
    </p>
  </div>
</div>
