<div class="auth-wrapper">
  <div class="auth-card surface-card">
    <div class="auth-brand">
      <img src="DataBridge%202.png" alt="DataBridge" class="auth-logo" />
      <span>{{ 'brand' | translate }}</span>
    </div>
    <h1>{{ 'auth.forgot.title' | translate }}</h1>
    <p class="auth-sub">{{ 'auth.forgot.subtitle' | translate }}</p>

    @if (error()) {
      <p-message severity="error" [text]="error()! | translate" styleClass="auth-msg" />
    }

    @if (sent()) {
      <p-message severity="success" [text]="'auth.forgot.sent' | translate" styleClass="auth-msg" />
      <p class="auth-foot">
        <a routerLink="/login">{{ 'auth.forgot.backToLogin' | translate }}</a>
      </p>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <label class="field">
          <span>{{ 'common.email' | translate }}</span>
          <input pInputText type="email" formControlName="email"
                 autocomplete="email" placeholder="you@example.com" fluid />
          @if (form.controls.email.touched && form.controls.email.invalid) {
            <small class="field-error">{{ 'auth.validation.emailRequired' | translate }}</small>
          }
        </label>

        <p-button type="submit" [label]="'auth.forgot.submit' | translate"
                  icon="pi pi-envelope" [loading]="loading()" fluid />
      </form>

      <p class="auth-foot">
        <a routerLink="/login">{{ 'auth.forgot.backToLogin' | translate }}</a>
      </p>
    }
  </div>
</div>
