<div class="auth-wrapper">
  <div class="auth-card surface-card">
    <div class="auth-brand">
      <img src="DataBridge%202.png" alt="DataBridge" class="auth-logo" />
      <span>{{ 'brand' | translate }}</span>
    </div>
    <h1>{{ 'auth.reset.title' | translate }}</h1>
    <p class="auth-sub">{{ 'auth.reset.subtitle' | translate }}</p>

    @if (error()) {
      <p-message severity="error" [text]="error()! | translate" styleClass="auth-msg" />
    }

    @if (missingToken()) {
      <p-message severity="warn" [text]="'auth.reset.missingToken' | translate" styleClass="auth-msg" />
      <p class="auth-foot">
        <a routerLink="/forgot-password">{{ 'auth.reset.requestNew' | translate }}</a>
      </p>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <label class="field">
          <span>{{ 'profile.newPwd' | translate }}</span>
          <p-password formControlName="newPassword" [toggleMask]="true"
                      autocomplete="new-password" placeholder="••••••••" fluid />
          @if (form.controls.newPassword.touched && form.controls.newPassword.errors?.['pattern']) {
            <small class="field-error">{{ 'users.passwordPolicy' | translate }}</small>
          }
          @if (form.controls.newPassword.touched && form.controls.newPassword.errors?.['minlength']) {
            <small class="field-error">{{ 'auth.validation.passwordMin8' | translate }}</small>
          }
        </label>

        <label class="field">
          <span>{{ 'profile.confirmPwd' | translate }}</span>
          <p-password formControlName="confirmPassword" [feedback]="false" [toggleMask]="true"
                      autocomplete="new-password" placeholder="••••••••" fluid />
          @if (form.touched && form.hasError('mismatch')) {
            <small class="field-error">{{ 'auth.validation.mismatch' | translate }}</small>
          }
        </label>

        <p-button type="submit" [label]="'auth.reset.submit' | translate"
                  icon="pi pi-check" [loading]="loading()" fluid />
      </form>

      <p class="auth-foot">
        <a routerLink="/login">{{ 'auth.forgot.backToLogin' | translate }}</a>
      </p>
    }
  </div>
</div>
