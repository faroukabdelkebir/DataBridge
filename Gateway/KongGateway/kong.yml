# =====================================================================
#  Kong - configuration declarative (mode DB-less)
#
#  DIFFERENCE AVEC LA VERSION LOCALE :
#  en local les services tournaient sur l'hote, d'ou host.docker.internal.
#  En production tout est conteneurise sur le reseau "databridge",
#  on utilise donc directement les noms de services Docker.
#
#  CORS : le frontend appelle Kong via nginx en chemin relatif
#  (meme origine), le plugin cors n'est donc plus necessaire.
#  Il est conserve en commentaire au cas ou tu exposerais Kong
#  directement sur le port 8000.
# =====================================================================

_format_version: "3.0"
_transform: true

services:
  - name: userms
    url: http://userms:8085
    routes:
      - name: userms-route
        paths: [/userms]
        strip_path: true

  - name: authms
    url: http://authms:8090
    read_timeout: 600000
    write_timeout: 600000
    routes:
      - name: authms-route
        paths: [/authms]
        strip_path: true
      # Endpoints OAuth2 servis a la racine : le client et les
      # resource servers doivent y acceder sans prefixe.
      - name: authms-oauth2-route
        paths: [/oauth2, /.well-known]
        strip_path: false

  - name: extractor
    url: http://t24extractor:65005
    routes:
      - name: extractor-route
        paths: [/extractor]
        strip_path: true

  - name: monitoring
    url: http://monitoringms:65010
    routes:
      - name: monitoring-route
        paths: [/monitoring]
        strip_path: true

  - name: aiagents
    url: http://ai-agents:65015
    # Les agents LLM peuvent etre lents : on allonge les timeouts (en ms)
    connect_timeout: 60000
    read_timeout: 600000
    write_timeout: 600000
    routes:
      - name: aiagents-route
        paths: [/aiagents]
        strip_path: true
    plugins:
      # Protection contre la saturation d'Ollama (agents couteux en CPU)
      - name: rate-limiting
        config:
          minute: 10
          policy: local

