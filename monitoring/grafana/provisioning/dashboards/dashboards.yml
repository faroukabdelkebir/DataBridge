# Charge automatiquement les dashboards places dans /var/lib/grafana/dashboards
apiVersion: 1

providers:
  - name: DataBridge
    orgId: 1
    folder: DataBridge
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
