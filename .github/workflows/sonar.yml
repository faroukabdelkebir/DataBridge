name: Analyse Sonar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build modules Maven
        run: |
          for module in AuthMS UserMS EurekaServer MonitoringMS T24Extractor; do
            echo "::group::Build $module"
            mvn -B verify dependency:copy-dependencies \
              -DoutputDirectory=target/dependency \
              -f "Backend/$module/pom.xml"
            echo "::endgroup::"
          done

      - name: Vérifier les répertoires de classes
        run: ls -d Backend/*/target/test-classes || echo "AUCUN test-classes trouvé"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Backend/extractor_ai_agents/requirements-dev.txt

      - name: Tests Agents IA
        working-directory: Backend/extractor_ai_agents
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest --cov=. --cov-report=xml --junitxml=test-results.xml

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Tests frontend
        working-directory: Frontend
        run: |
          npm ci
          npx ng test --coverage

      - name: Analyse SonarCloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -X
