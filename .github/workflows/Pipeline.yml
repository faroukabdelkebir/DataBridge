name: Pipeline DataBridge

# =====================================================================
#  build -> tests -> SonarCloud -> artefacts Nexus
#                               -> images ghcr.io
#                               -> deploiement -> verification monitoring
#
#  Repartition des registres :
#    - ghcr.io : images Docker (prive et gratuit, pas de tunnel SSH)
#    - Nexus   : jars Maven en SNAPSHOT (maven-snapshots)
# =====================================================================

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  JAVA_MODULES: "AuthMS UserMS EurekaServer MonitoringMS T24Extractor"
  REGISTRY: ghcr.io

jobs:

  # ==================================================================
  #  1. BUILD - compilation et tests unitaires Java
  # ==================================================================
  build-backend:
    name: build-test-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # requis par Sonar (blame, New Code)

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compiler et tester les modules
        run: |
          for module in $JAVA_MODULES; do
            echo "::group::$module"
            mvn -B verify dependency:copy-dependencies \
              -DoutputDirectory=target/dependency \
              -f "Backend/$module/pom.xml"
            echo "::endgroup::"
          done

      - name: Recapitulatif des tests
        if: always()
        run: grep -h "Tests run:" Backend/*/target/surefire-reports/*.txt 2>/dev/null | tail -20 || true

      - name: Publier les jars
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: Backend/*/target/*.jar
          retention-days: 1

      - name: Publier les rapports et classes
        uses: actions/upload-artifact@v4
        with:
          name: backend-analyse
          path: |
            Backend/*/target/classes/**
            Backend/*/target/test-classes/**
            Backend/*/target/site/jacoco/jacoco.xml
            Backend/*/target/surefire-reports/**
            Backend/*/target/dependency/*.jar
          retention-days: 1

  # ==================================================================
  #  2. TESTS - agents IA Python et frontend Angular, en parallele
  # ==================================================================
  test-agents-ia:
    name: build-test-agents IA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Backend/extractor_ai_agents/requirements-dev.txt

      - name: Installer et tester
        working-directory: Backend/extractor_ai_agents
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest --cov=. --cov-report=xml --junitxml=test-results.xml

      - uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: Backend/extractor_ai_agents/coverage.xml
          retention-days: 1

  test-frontend:
    name: build-test-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Installer et tester
        working-directory: Frontend
        run: |
          npm ci
          npx ng test --coverage

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: Frontend/coverage/**
          retention-days: 1

  # ==================================================================
  #  3. QUALITE - SonarCloud analyse Java, TypeScript et Python
  # ==================================================================
  sonar:
    name: Analyse SonarCloud
    needs: [build-backend, test-frontend, test-agents-ia]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Recuperer les artefacts backend
        uses: actions/download-artifact@v4
        with:
          name: backend-analyse
          path: Backend

      - name: Recuperer la couverture frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: Frontend/coverage

      - name: Recuperer la couverture Python
        uses: actions/download-artifact@v4
        with:
          name: python-coverage
          path: Backend/extractor_ai_agents

      - name: Analyse SonarCloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ==================================================================
  #  4. ARTEFACTS - publication des jars SNAPSHOT dans Nexus
  #
  #  Nexus n'est pas expose sur Internet : un tunnel SSH redirige
  #  le port 8081 vers le runner. Les pom.xml doivent declarer
  #  <distributionManagement> avec l'URL http://localhost:8081/...
  # ==================================================================
  publier-artefacts:
    name: Artefacts Nexus
    needs: sonar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ouvrir un tunnel SSH vers Nexus
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.NEXUS_HOST }} >> ~/.ssh/known_hosts
          ssh -f -N -L 8081:localhost:8081 -i ~/.ssh/id_rsa ubuntu@${{ secrets.NEXUS_HOST }}
          sleep 3
          curl -s -o /dev/null -w "Nexus repond : %{http_code}\n" http://localhost:8081/

      # Maven lit les identifiants depuis settings.xml, jamais depuis
      # le pom : les secrets ne sont donc pas versionnes.
      - name: Configurer les identifiants Maven
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'FIN'
          <settings>
            <servers>
              <server>
                <id>nexus-snapshots</id>
                <username>NEXUS_USER_PLACEHOLDER</username>
                <password>NEXUS_PASS_PLACEHOLDER</password>
              </server>
              <server>
                <id>nexus-releases</id>
                <username>NEXUS_USER_PLACEHOLDER</username>
                <password>NEXUS_PASS_PLACEHOLDER</password>
              </server>
            </servers>
          </settings>
          FIN
          sed -i "s|NEXUS_USER_PLACEHOLDER|${{ secrets.NEXUS_USER }}|g" ~/.m2/settings.xml
          sed -i "s|NEXUS_PASS_PLACEHOLDER|${{ secrets.NEXUS_PASSWORD }}|g" ~/.m2/settings.xml

      # -DskipTests : les tests ont deja tourne dans build-backend.
      - name: Deployer les jars SNAPSHOT
        run: |
          for module in $JAVA_MODULES; do
            echo "::group::deploy $module"
            mvn -B deploy -DskipTests -f "Backend/$module/pom.xml"
            echo "::endgroup::"
          done

  # ==================================================================
  #  5. IMAGES - construction et publication vers ghcr.io
  #
  #  GITHUB_TOKEN suffit a s'authentifier : aucun secret a gerer.
  #  Les images sont privees par defaut, comme le depot.
  # ==================================================================
  docker-build:
    name: Image ${{ matrix.name }}
    needs: sonar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # requis pour pousser vers ghcr.io
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: eureka,       context: Backend/EurekaServer,        maven: true}
          - {name: authms,       context: Backend/AuthMS,              maven: true}
          - {name: userms,       context: Backend/UserMS,              maven: true}
          - {name: monitoringms, context: Backend/MonitoringMS,        maven: true}
          - {name: t24extractor, context: Backend/T24Extractor,        maven: true}
          - {name: ai-agents,    context: Backend/extractor_ai_agents, maven: false}
          - {name: frontend,     context: Frontend,                    maven: false}

    steps:
      - uses: actions/checkout@v5

      - name: Recuperer les jars
        if: matrix.maven
        uses: actions/download-artifact@v4
        with:
          name: jars
          path: Backend

      - name: Verifier la presence du jar
        if: matrix.maven
        run: ls -lh "${{ matrix.context }}"/target/*.jar

      - name: Authentification a ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Le nom du proprietaire doit etre en minuscules pour ghcr.io.
      - name: Determiner le prefixe des images
        id: prefixe
        run: echo "valeur=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')" >> $GITHUB_OUTPUT

      - name: Construire et pousser
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.prefixe.outputs.valeur }}/databridge-${{ matrix.name }}:${{ github.sha }}
            ${{ steps.prefixe.outputs.valeur }}/databridge-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ==================================================================
  #  6. DEPLOIEMENT sur l'instance applicative
  # ==================================================================
  deploy:
    name: Deploiement
    needs: [docker-build, publier-artefacts]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Envoyer les fichiers de deploiement
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,Gateway/KongGateway/kong.yml,monitoring/**"
          target: "~/databridge"

      - name: Redeployer
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          # GHCR_TOKEN : jeton personnel GitHub avec le scope read:packages
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd ~/databridge
            # scp conserve l'arborescence : on remonte kong.yml a plat
            cp Gateway/KongGateway/kong.yml ./kong.yml
            # TAG surcharge la valeur du .env pour ce deploiement
            sed -i "s|^TAG=.*|TAG=${{ github.sha }}|" .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            sleep 30
            docker compose ps
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

      - name: Verifier que l'application repond
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              http://${{ secrets.EC2_HOST }}/authms/actuator/health || echo 000)
            echo "tentative $i : $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "AuthMS ne repond pas apres le deploiement"
          exit 1

  # ==================================================================
  #  7. MONITORING - verification de la collecte apres redeploiement
  # ==================================================================
  verifier-monitoring:
    name: Verification monitoring
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Controler les cibles Prometheus et Grafana
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/databridge

            echo "--- Cibles Prometheus ---"
            sleep 45
            resultat=$(docker compose exec -T prometheus \
              wget -qO- 'http://localhost:9090/api/v1/targets?state=active')

            echo "$resultat" | tr ',' '\n' | grep -E '"(instance|health)"'

            hs=$(echo "$resultat" | grep -o '"health":"up"' | wc -l)
            total=$(echo "$resultat" | grep -o '"health":"' | wc -l)
            echo "Cibles actives : $hs / $total"

            echo "--- Grafana ---"
            docker compose exec -T grafana \
              wget -qO- http://localhost:3000/api/health || echo "Grafana ne repond pas"

            [ "$hs" -lt "$total" ] && echo "::warning::certaines cibles Prometheus sont DOWN"
            exit 0